<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTrex AI - GitHub Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="bg-blue-600 text-white p-2 rounded-lg font-bold"><i class="fa-solid fa-robot"></i></div>
            <h1 class="font-semibold text-lg">BTrex AI Assistant</h1>
        </div>
        <button onclick="toggleSettings()" class="bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-md text-sm transition">
            <i class="fa-solid fa-gear mr-1"></i> Config Token
        </button>
    </header>

    <!-- Token Settings Modal -->
    <div id="settingsModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
        <div class="bg-gray-800 border border-gray-700 p-6 rounded-xl w-96 shadow-xl">
            <h3 class="text-lg font-bold mb-3">GitHub API Token</h3>
            <p class="text-sm text-gray-400 mb-4">Paste your Personal Access Token starting with <code>ghp_</code> or <code>github_pat_</code>.</p>
            <input type="password" id="ghToken" placeholder="github_pat_xxx" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm mb-4 focus:outline-none focus:border-blue-500">
            <div class="flex justify-end space-x-2">
                <button onclick="toggleSettings()" class="px-4 py-2 bg-gray-700 rounded-lg text-sm">Cancel</button>
                <button onclick="saveToken()" class="px-4 py-2 bg-blue-600 rounded-lg text-sm font-medium">Save Token</button>
            </div>
        </div>
    </div>

    <!-- Chat Window -->
    <div id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-6 max-w-4xl w-full mx-auto">
        <div class="flex items-start space-x-4">
            <div class="bg-blue-600 text-white rounded-full h-8 w-8 flex items-center justify-center shrink-0"><i class="fa-solid fa-robot text-xs"></i></div>
            <div class="bg-gray-800 border border-gray-700 p-4 rounded-2xl max-w-2xl text-sm leading-relaxed">
                Welcome back! Type commands like:<br>
                • <code>list repos</code> - See all your repositories<br>
                • <code>read repo-name/file.ext</code> - Read a file's code<br>
                • <code>edit repo-name/file.ext | new content</code> - Update or edit a file
            </div>
        </div>
    </div>

    <!-- Input Box -->
    <div class="p-4 bg-gray-900 border-t border-gray-800">
        <div class="max-w-4xl mx-auto flex items-center bg-gray-800 border border-gray-700 rounded-xl p-2 focus-within:border-blue-500 transition">
            <textarea id="userInput" rows="1" placeholder="Type 'list repos' or ask to inspect/edit code..." class="w-full bg-transparent resize-none outline-none px-3 text-sm text-gray-100 placeholder-gray-500"></textarea>
            <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition shrink-0 ml-2">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script>
        function toggleSettings() {
            document.getElementById('settingsModal').classList.toggle('hidden');
        }

        function saveToken() {
            const token = document.getElementById('ghToken').value.trim();
            if (token) {
                localStorage.setItem('github_token', token);
                alert('Token saved!');
                toggleSettings();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            const token = localStorage.getItem('github_token');

            if (!text) return;
            if (!token) {
                alert('Please configure your GitHub token first!');
                return;
            }

            const chatContainer = document.getElementById('chatContainer');
            
            // Append User Message
            chatContainer.innerHTML += `
                <div class="flex items-start justify-end space-x-4">
                    <div class="bg-blue-600 text-white p-4 rounded-2xl max-w-2xl text-sm leading-relaxed">${escapeHtml(text)}</div>
                </div>`;
            input.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const headers = { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' };

            // Command Processing
            if (text.toLowerCase() === 'list repos') {
                const res = await fetch('https://api.github.com/user/repos', { headers });
                const repos = await res.json();
                const repoList = repos.map(r => `• <b>${r.name}</b>`).join('<br>');
                appendBotReply(`<b>Your Repositories:</b><br>${repoList}`);
            } 
            else if (text.toLowerCase().startsWith('read ')) {
                const pathParts = text.replace('read ', '').trim().split('/');
                const repo = pathParts[0];
                const filePath = pathParts.slice(1).join('/');
                const userRes = await fetch('https://api.github.com/user', { headers });
                const userData = await userRes.json();

                const res = await fetch(`https://api.github.com/repos/${userData.login}/${repo}/contents/${filePath}`, { headers });
                const data = await res.json();
                if (data.content) {
                    const decodedCode = atob(data.content);
                    appendBotReply(`<b>File Content (${filePath}):</b><pre class="bg-gray-900 p-3 rounded-lg mt-2 overflow-x-auto text-xs"><code>${escapeHtml(decodedCode)}</code></pre>`);
                } else {
                    appendBotReply(`Could not read file ${filePath}. Check repository and path name.`);
                }
            } 
            else {
                appendBotReply("Command received! You can type <code>list repos</code> to list all projects, or <code>read repo-name/file.js</code> to inspect source code.");
            }
        }

        function appendBotReply(htmlContent) {
            const chatContainer = document.getElementById('chatContainer');
            chatContainer.innerHTML += `
                <div class="flex items-start space-x-4">
                    <div class="bg-blue-600 text-white rounded-full h-8 w-8 flex items-center justify-center shrink-0"><i class="fa-solid fa-robot text-xs"></i></div>
                    <div class="bg-gray-800 border border-gray-700 p-4 rounded-2xl max-w-2xl text-sm leading-relaxed">${htmlContent}</div>
                </div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function escapeHtml(unsafe) {
            return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
